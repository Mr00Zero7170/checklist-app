<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily checklist</title>
<meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #F6F8FB;
    --surface: #FFFFFF;
    --ink: #18202B;
    --muted: #667085;
    --line: #E1E6ED;
    --accent: #2B4BD8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6EBFD;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161C;
      --surface: #1A2029;
      --ink: #E8ECF2;
      --muted: #98A2B3;
      --line: #2A323E;
      --accent: #7C93FF;
      --accent-ink: #0F1420;
      --accent-soft: #232C4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161C;
    --surface: #1A2029;
    --ink: #E8ECF2;
    --muted: #98A2B3;
    --line: #2A323E;
    --accent: #7C93FF;
    --accent-ink: #0F1420;
    --accent-soft: #232C4A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 56px;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .summary { color: var(--muted); margin: 0; font-size: 1rem; }
  .bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 20px 0 28px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 2px;
    transition: width .35s ease;
  }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }
  .task:last-child { border-bottom: 1px solid var(--line); }
  .check {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
    color: var(--accent-ink);
    padding: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .15s ease, border-color .15s ease;
  }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s ease; }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task.done .check svg { opacity: 1; }
  .body { flex: 1; min-width: 0; cursor: pointer; }
  .title { font-size: 1.05rem; font-weight: 500; margin: 2px 0 0; }
  .task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  .timer {
    flex: none;
    align-self: center;
    font: inherit;
    font-size: .9rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    background: var(--accent-soft);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .timer.running { background: var(--accent); color: var(--accent-ink); }
  .book-progress { margin-top: 12px; cursor: default; }
  .book-progress input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .book-progress .pct { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .week { margin-top: 36px; }
  .week h2 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { text-align: center; font-size: .8rem; color: var(--muted); }
  .day i {
    display: block;
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: linear-gradient(var(--accent), var(--accent)) no-repeat;
    background-size: 100% 0;
    background-position: bottom;
    margin-bottom: 6px;
  }
  .day.today { color: var(--ink); font-weight: 600; }
  .day.today i { border-color: var(--accent); }
  .streak { color: var(--muted); font-size: .95rem; margin: 14px 0 0; }
  .reset {
    margin-top: 28px;
    font: inherit;
    font-size: .9rem;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1 id="date"></h1>
  <p class="summary" id="summary"></p>
  <div class="bar" aria-hidden="true"><span id="barfill"></span></div>

  <ul class="tasks" id="tasks"></ul>

  <section class="week">
    <h2>This week</h2>
    <div class="days" id="days"></div>
    <p class="streak" id="streak"></p>
  </section>

  <button class="reset" id="reset" type="button">Reset today</button>
</main>

<script>
(function () {
  var STORE_KEY = 'daily-checklist-v1';
  var TASKS = [
    { id: 'dsa',    title: 'Solve 1 DSA question',               sub: 'In the language you are learning' },
    { id: 'typing', title: 'Typing practice',                    sub: '30 minutes of touch typing', mins: 30 },
    { id: 'duo',    title: 'Duolingo',                           sub: '15 minutes', mins: 15 },
    { id: 'book',   title: 'Read The Easy Way to Stop Smoking',  sub: 'Read a bit today', book: true }
  ];
  var TICK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';

  var state = { days: {}, book: 0 };
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        state.days = parsed.days || {};
        state.book = Number(parsed.book) || 0;
      }
    }
  } catch (e) {}

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function keyFor(d) {
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  var todayKey = keyFor(new Date());
  var timers = {}; // id -> end timestamp

  function doneList(k) { return state.days[k] || []; }
  function isComplete(k) {
    var d = doneList(k);
    return TASKS.every(function (t) { return d.indexOf(t.id) !== -1; });
  }
  function countDone(k) {
    var d = doneList(k);
    return TASKS.filter(function (t) { return d.indexOf(t.id) !== -1; }).length;
  }
  function streak() {
    var n = 0;
    var d = new Date();
    if (!isComplete(keyFor(d))) d.setDate(d.getDate() - 1);
    while (isComplete(keyFor(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function setDone(id, on) {
    var list = doneList(todayKey).slice();
    var i = list.indexOf(id);
    if (on && i === -1) list.push(id);
    if (!on && i !== -1) list.splice(i, 1);
    state.days[todayKey] = list;
    save();
  }

  function fmt(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function timerLabel(t) {
    if (timers[t.id]) return 'Stop ' + fmt(timers[t.id] - Date.now());
    return 'Start ' + t.mins + ':00';
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render() {
    var d = new Date();
    document.getElementById('date').textContent =
      d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    var done = doneList(todayKey);
    var n = countDone(todayKey);
    document.getElementById('summary').textContent =
      n === TASKS.length ? 'All done for today.' : n + ' of ' + TASKS.length + ' done';
    document.getElementById('barfill').style.width = (n / TASKS.length * 100) + '%';

    document.getElementById('tasks').innerHTML = TASKS.map(function (t) {
      var isDone = done.indexOf(t.id) !== -1;
      var sub = t.sub;
      var extra = '';
      if (t.book) {
        if (state.book >= 100) sub = 'Finished. Nice work.';
        extra =
          '<div class="book-progress">' +
            '<input type="range" min="0" max="100" step="1" value="' + state.book + '" id="bookRange" aria-label="Book progress">' +
            '<div class="pct" id="bookPct">' + state.book + '% read</div>' +
          '</div>';
      }
      var timer = t.mins
        ? '<button class="timer' + (timers[t.id] ? ' running' : '') + '" type="button" data-timer="' + t.id + '">' + esc(timerLabel(t)) + '</button>'
        : '';
      return '<li class="task' + (isDone ? ' done' : '') + '">' +
        '<button class="check" type="button" role="checkbox" aria-checked="' + isDone + '" aria-label="' + esc(t.title) + '" data-toggle="' + t.id + '">' + TICK + '</button>' +
        '<div class="body"' + (t.book ? '' : ' data-toggle="' + t.id + '"') + '>' +
          '<p class="title" data-toggle="' + t.id + '">' + esc(t.title) + '</p>' +
          '<p class="sub">' + esc(sub) + '</p>' +
          extra +
        '</div>' +
        timer +
      '</li>';
    }).join('');

    var days = '';
    for (var i = 6; i >= 0; i--) {
      var dd = new Date();
      dd.setDate(dd.getDate() - i);
      var k = keyFor(dd);
      var pct = countDone(k) / TASKS.length * 100;
      days += '<div class="day' + (i === 0 ? ' today' : '') + '">' +
        '<i style="background-size:100% ' + pct + '%"></i>' +
        dd.toLocaleDateString('en-GB', { weekday: 'short' }) +
      '</div>';
    }
    document.getElementById('days').innerHTML = days;

    var s = streak();
    document.getElementById('streak').textContent =
      s > 0 ? s + '-day streak' : 'Finish all four tasks in a day to start a streak.';
  }

  function tickTimers() {
    var finished = false;
    TASKS.forEach(function (t) {
      if (!timers[t.id]) return;
      if (Date.now() >= timers[t.id]) {
        delete timers[t.id];
        setDone(t.id, true);
        finished = true;
        document.title = 'Time is up: ' + t.title;
      }
    });
    if (finished) { render(); return; }
    var btns = document.querySelectorAll('[data-timer]');
    for (var i = 0; i < btns.length; i++) {
      var t = TASKS.filter(function (x) { return x.id === btns[i].getAttribute('data-timer'); })[0];
      if (t && timers[t.id]) btns[i].textContent = timerLabel(t);
    }
  }

  document.addEventListener('click', function (e) {
    var tgl = e.target.closest('[data-toggle]');
    if (tgl) {
      var id = tgl.getAttribute('data-toggle');
      setDone(id, doneList(todayKey).indexOf(id) === -1);
      render();
      return;
    }
    var tm = e.target.closest('[data-timer]');
    if (tm) {
      var tid = tm.getAttribute('data-timer');
      var task = TASKS.filter(function (x) { return x.id === tid; })[0];
      if (timers[tid]) { delete timers[tid]; }
      else { timers[tid] = Date.now() + task.mins * 60000; document.title = 'Daily checklist'; }
      render();
      return;
    }
    if (e.target.id === 'reset') {
      state.days[todayKey] = [];
      timers = {};
      save();
      render();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'bookRange') {
      state.book = Number(e.target.value);
      document.getElementById('bookPct').textContent = state.book + '% read';
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'bookRange') {
      save();
      render();
    }
  });

  function checkNewDay() {
    var k = keyFor(new Date());
    if (k !== todayKey) { todayKey = k; render(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { checkNewDay(); tickTimers(); }
  });
  setInterval(function () { checkNewDay(); tickTimers(); }, 500);

  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
